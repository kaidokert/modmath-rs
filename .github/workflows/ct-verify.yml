# SPDX-License-Identifier: Apache-2.0

name: CT Verify

on:
    push:
      branches:
        - main
        - 'feature/**'
    pull_request:
    schedule:
      - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ct:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # "z" is the pinned profile; downstream deployments build at "s",
        # where inlining moves helper bodies into the fixtures.
        opt: ["s", "z"]
        # AVR (priority 4 in the driver's target table) is not in the
        # matrix yet — it needs nightly + build-std and has not been
        # calibrated. Add it in a follow-up once its extras are known.
        triple:
          - thumbv7em-none-eabi # Priority 1: Cortex-M3/M4
          - thumbv7m-none-eabi
          - thumbv6m-none-eabi # Priority 2: Cortex-M0
          - riscv32imc-unknown-none-elf # Priority 3: 32-bit RISC-V
          - riscv32imac-unknown-none-elf
          - aarch64-unknown-linux-gnu # Priority 5
          - x86_64-unknown-linux-gnu # Priority 6
        include:
          # +lzcnt,+bmi1 mirrors ct-ctgrind.yml: baseline-x86_64 lowers
          # bit-count intrinsics to a `test/je/bsr` sequence whose `je`
          # (handling bsr's undefined-on-zero case) is a real data-dependent
          # branch in the std intrinsic. BMI1 is on Haswell+ (2013) and every
          # GitHub Actions x86_64 runner.
          - triple: x86_64-unknown-linux-gnu
            extra_rustflags: "-C target-feature=+lzcnt,+bmi1"
    runs-on: ubuntu-latest
    name: ${{ matrix.triple }} (opt ${{ matrix.opt }})
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.triple }}
          components: llvm-tools-preview

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ct-verify-${{ matrix.triple }}-${{ matrix.opt }}

      - name: Scope per-target RUSTFLAGS to the cross-build
        # Cargo applies CARGO_TARGET_<TRIPLE>_RUSTFLAGS only when
        # building for that target, so the flags reach the fixtures
        # cross-build without leaking into the host ct-driver compile.
        if: matrix.extra_rustflags != ''
        run: |
          name="CARGO_TARGET_$(echo '${{ matrix.triple }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
          echo "$name=${{ matrix.extra_rustflags }}" >> "$GITHUB_ENV"

      - name: Run ct-driver
        run: cargo run --release -p ct-driver -- --target ${{ matrix.triple }} --json-out target/ct-report/${{ matrix.triple }}-${{ matrix.opt }}.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct-report-${{ matrix.triple }}-${{ matrix.opt }}
          path: target/ct-report/
          retention-days: 30

  # A reachable panic in CT code is both a DoS edge and a timing oracle
  # (the formatting path's cost depends on the values being formatted).
  # Two representative ISAs; the property is codegen-level, not
  # per-target.
  panic-audit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opt: ["s", "z"]
        triple:
          - thumbv7m-none-eabi
          - riscv32imc-unknown-none-elf
    runs-on: ubuntu-latest
    name: panic-audit ${{ matrix.triple }} (opt ${{ matrix.opt }})
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.triple }}
          components: llvm-tools-preview

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: panic-audit-${{ matrix.triple }}-${{ matrix.opt }}

      - name: Install krabi-caliper
        run: cargo install krabi-caliper --version 0.1.0 --features cli,campaign

      - name: Run panic-free audit
        run: |
          cargo krabi-caliper panic-audit \
            --workspace . \
            --package panic-free-audit \
            --target ${{ matrix.triple }} \
            --features panic-handler \
            --negative-features neg-controls \
            --owned-symbol '.*' \
            --expect-negative panic_audit__neg__bounds_check \
            --expect-negative panic_audit__neg__unwrap \
            --expect-negative panic_audit__neg__expect \
            --json target/panic-audit/${{ matrix.triple }}-${{ matrix.opt }}.json
